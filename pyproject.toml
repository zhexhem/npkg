[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npkg"
version = "0.2.0"
description = "Neovim Plugin Manager — git-free, tarball-based, themeable"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "You", email = "you@example.com" }]
keywords = ["neovim", "nvim", "plugin-manager", "pynvim", "vim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Text Editors",
]

dependencies = ["pynvim>=0.5.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "black", "mypy"]

[project.urls]
Homepage = "https://github.com/zhexhem/npkg"
Repository = "https://github.com/zhexhem/npkg"
Issues = "https://github.com/zhexhem/npkg/issues"

[project.scripts]
npkg = "npkg.cli:main"

[tool.setuptools]
packages = ["npkg"]
include-package-data = true

[tool.setuptools.package-data]
npkg = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"